<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Users</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="../main.css">
  <link rel="stylesheet" href="admin-nav.css">
</head>
<body>
  <div id="adminNav"></div>

  <div class="container my-4">
    <h2 class="mb-4">Manage Users</h2>
    <div id="usersMessage" class="alert d-none"></div>

    <div class="card mb-4 shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Add New User</h5>
        <form id="addUserForm" class="row g-3 align-items-center">
          <div class="col-md-3">
            <input type="text" id="new_name" class="form-control" placeholder="Name" required>
          </div>
          <div class="col-md-3">
            <input type="email" id="new_email" class="form-control" placeholder="Email" required>
          </div>
          <div class="col-md-3">
            <input type="password" id="new_password" class="form-control" placeholder="Password" required>
          </div>
          <div class="col-md-2 form-check">
            <input class="form-check-input" type="checkbox" id="new_is_admin">
            <label class="form-check-label" for="new_is_admin">Make Admin</label>
          </div>
          <div class="col-md-1 d-grid">
            <button type="submit" class="btn btn-primary">Add</button>
          </div>
        </form>
      </div>
    </div>

    <table class="table table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Password (new)</th>
          <th>Admin</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="usersTableBody"></tbody>
    </table>
  </div>

  <script src="../auth.js"></script>
  <script src="admin.js"></script>
</body>
</html>
