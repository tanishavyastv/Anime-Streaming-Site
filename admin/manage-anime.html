<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Anime</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="manage.css">
  <link rel="stylesheet" href="../main.css">
  <link rel="stylesheet" href="admin-nav.css">
</head>
<body>
  <div id="adminNav"></div>

  <div class="container">
    <h2 class="mb-4">Manage Anime Listings</h2>
    <div id="animeMessage" class="alert d-none"></div>

    <div class="card mb-4 p-4 shadow-sm">
      <h4>Add New Anime</h4>
      <form id="addAnimeForm">
        <div class="row g-3">
          <div class="col-md-3">
            <input type="text" id="new_title" class="form-control" placeholder="Title" required>
          </div>
          <div class="col-md-4">
            <textarea id="new_description" class="form-control" rows="1" placeholder="Description" required></textarea>
          </div>
          <div class="col-md-3">
            <input type="text" id="new_image_url" class="form-control" placeholder="Image URL" required>
          </div>
          <div class="col-md-2 d-grid">
            <button type="submit" class="btn btn-primary">Add Anime</button>
          </div>
        </div>
      </form>
    </div>

    <table class="table table-striped">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Description</th>
          <th>Image</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="animeTableBody"></tbody>
    </table>
  </div>

  <script src="../auth.js"></script>
  <script src="admin.js"></script>
</body>
</html>
