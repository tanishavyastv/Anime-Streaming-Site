<!DOCTYPE html>
<html lang="en">
<head>

  <title>Activity Log</title>

  <link rel="stylesheet" href="../main.css">
  <link rel="stylesheet" href="admin-nav.css">
</head>
<body>

  <script src="../auth.js"></script>
  <script src="admin.js"></script>

</html>
