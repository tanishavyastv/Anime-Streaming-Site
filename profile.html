<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header id="navbar"></header>

    <div class="container my-5">
        <h2 class="text-center" id="profileHeading">Welcome to Your Profile</h2>
        <div class="text-center mb-4 d-none" id="profileImageWrapper">
            <img id="profileImage" alt="Profile Picture" class="rounded-circle" width="150" height="150" style="object-fit: cover; border: 3px solid #ffc107;">
        </div>

        <form id="profileForm">
            <div class="mb-3">
                <label for="user_name" class="form-label">Username</label>
                <input type="text" class="form-control" id="user_name" disabled>
            </div>
            <div class="mb-3">
                <label for="profilePic" class="form-label">Profile Picture</label>
                <input type="file" class="form-control" id="profilePic" accept="image/*">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">New Password (Leave empty if not changing)</label>
                <input type="password" class="form-control" id="password">
            </div>
            <div id="profileMessage" class="alert d-none"></div>
            <button type="submit" class="btn btn-warning">Update Profile</button>
        </form>
    </div>

    <footer id="footer"></footer>

    <script src="auth.js"></script>
    <script src="site-shell.js"></script>
    <script src="profile.js"></script>
</body>
</html>
