<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - H!Anime</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <header id="navbar"></header>

    <main class="page-shell">
        <section class="page-banner">
            <span class="page-banner__eyebrow">Search Desk</span>
            <h1 class="page-banner__title">Results tuned for <span class="accent">discovery</span>.</h1>
            <p class="page-banner__copy">Search results now sit inside the same cinematic shell as the rest of the project, so even utility pages still feel designed.</p>
            <div class="page-banner__meta">
                <span class="meta-pill">API-powered results</span>
                <span class="meta-pill">Genre chips</span>
                <span class="meta-pill">External watch links</span>
            </div>
        </section>

        <section class="content-panel">
            <div class="section-heading">
                <div>
                    <span class="section-kicker">Matches</span>
                    <h2 class="section-title">Search Results</h2>
                </div>
                <p class="section-copy" id="searchResultsSummary">Loading your anime matches...</p>
            </div>

            <div class="text-center my-5" id="loadingSpinner">
                <div class="spinner-border text-warning" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>

            <div class="row g-4" id="searchResultsGrid"></div>
        </section>
    </main>

    <footer id="footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="search-results.js"></script>
    <script src="auth.js"></script>
    <script src="site-shell.js"></script>
</body>

</html>
